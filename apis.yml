aid: stilla
name: Stilla
description: >-
  Stilla is an AI teammate for the whole company — an AI agent that connects to a team's
  tools (Slack, Microsoft Teams, GitHub, Linear, Notion, Google Workspace and 3,000+ more)
  and turns chats, meetings, and conversations into finished work: ads, code, reports,
  tasks, and documents. Team members mention @Stilla to delegate work, and reusable agents
  configured in natural language search across connected tools, take actions, transcribe
  meetings, and persist context in collaborative canvases. Stilla exposes a REST API and an
  official remote Model Context Protocol (MCP) server so external AI tools (Claude Code,
  Cursor, and other MCP clients) can access a workspace's notes, decisions, and workflow
  outputs. Built by the team behind Shop Pay at Shopify, Stilla is SOC 2 Type II certified,
  GDPR compliant, and CASA Tier 2 assessed. Backed by General Catalyst.
